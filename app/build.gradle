// Kotlin is compiled by AGP's built-in Kotlin support — no kotlin-android plugin.
plugins {
    id 'com.android.application'
}

// Optional: create keystore.properties in the project root to sign releases with
// your own key. It is gitignored; without it the debug key is used.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.ncyxie.keepscreenoff'
    compileSdk 37

    defaultConfig {
        applicationId "com.ncyxie.keepscreenoff"
        minSdk 26
        // AGP 9 defaults targetSdk to compileSdk rather than minSdk, but set
        // it explicitly so the value doesn't drift with compileSdk.
        targetSdk 37
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            // AGP 9 only allows proguard-android-optimize.txt here;
            // proguard-android.txt is rejected because it implies -dontoptimize.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    // The libxposed API is Java 17 bytecode, so 17 is a floor, not a preference.
    // Built-in Kotlin aligns its jvmTarget with this; there is no kotlinOptions
    // block, since that belonged to the Kotlin plugin that AGP 9 replaces.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Never exclude META-INF/xposed/** — that is the module entry point.
            excludes += [
                "/META-INF/*.kotlin_module",
                "/META-INF/*.version",
                "**/kotlin/**",
                "DebugProbesKt.bin"
            ]
        }
    }
}

dependencies {
    // Provided by the framework at runtime; must not be bundled.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // The API declares this compileOnly, so it is not transitive. Without it
    // Kotlin cannot see @NonNull/@Nullable and silently drops null-safety.
    compileOnly 'androidx.annotation:annotation:1.10.0'
}
